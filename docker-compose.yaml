services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: mediadb
      POSTGRES_USER: postgres
    ports:
      - "5433:5432"
    mem_limit: ${DB_MEM:-2g}
    cpus: "${DB_CPUS:-2}"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo-test:
    image: mongo:7
    ports:
      - "27018:27017"
    mem_limit: ${DB_MEM:-2g}
    cpus: "${DB_CPUS:-2}"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata: